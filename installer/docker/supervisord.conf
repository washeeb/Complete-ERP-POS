; The programs that make up a running Synclytics server. Each restarts if it stops.
[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Routine jobs every minute: posting, sync, relay (live updates, messages, webhooks, GRA E-VAT), backups, reports.
[program:scheduler]
command=php artisan schedule:work
directory=/var/www/server
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Live updates to tills and screens (WebSockets on port 8080).
[program:reverb]
command=php artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/server
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:queue]
command=php artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/server
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

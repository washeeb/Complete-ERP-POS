server {
    listen 80 default_server;
    server_name _;
    root /var/www/server/public;
    index index.php;
    client_max_body_size 25m;

    # Smaller pages and catalogue downloads over slow links.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/manifest+json;

    # Files whose names or links change with each release are kept by the browser for a year.
    location ~ ^/(pos/assets|build|css|js|fonts|vendor)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The till app (single-page, works offline): unknown paths fall back to its index.
    location /pos/ {
        try_files $uri /pos/index.html;
        location = /pos/sw.js { add_header Cache-Control "no-cache"; }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known) { deny all; }
}

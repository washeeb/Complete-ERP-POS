  <circle cx="256" cy="256" r="44" fill="#06AAAA" stroke="#031E4C" stroke-width="14"/>
  <circle cx="146" cy="146" r="22" fill="#06AAAA"/>
  <circle cx="366" cy="366" r="22" fill="#06AAAA"/>
</svg>

[package]
name = "zionex-backoffice"
version = "1.0.0"
description = "The ZionEX back office as a desktop app for Windows"
authors = ["SyncLytics"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "zionex_backoffice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
mac_address = "1"
local-ip-address = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

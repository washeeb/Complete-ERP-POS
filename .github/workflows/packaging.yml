name: Packaging

# Builds and smoke-tests every way of installing (Phase 13): the Docker image, the Ubuntu install script, the Windows
# installer and the desktop till app. Runs when their files change, on release tags, and on demand.
on:
  pull_request:
    paths: ['installer/**', 'pos/src-tauri/**', '.github/workflows/packaging.yml', 'server/composer.lock', 'server/database/migrations/**']
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Settings for the test
        run: |
          cp installer/docker/.env.docker.example installer/docker/.env
          sed -i -e 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-test-password-123/' -e 's/^BACKUP_PASSPHRASE=.*/BACKUP_PASSPHRASE=ci test backup passphrase/' -e 's/^HTTP_PORT=.*/HTTP_PORT=8088/' installer/docker/.env
      - name: Build and start
        run: docker compose -f installer/docker/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: The server answers
        run: |
          curl -fsS http://localhost:8088/up
          curl -fsS http://localhost:8088/admin/login | grep -q 'Sign in'
          curl -fsS http://localhost:8088/pos/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8088/api/public/v1/openapi.json | grep -q '"openapi":"3.1.0"'
      - name: Backup and restore check inside the container
        run: |
          docker compose -f installer/docker/docker-compose.yml exec -T app php artisan erp:backup || true
          docker compose -f installer/docker/docker-compose.yml exec -T app php artisan erp:backup --verify
          docker compose -f installer/docker/docker-compose.yml exec -T app php artisan erp:health || true
      - if: failure()
        run: |
          docker compose -f installer/docker/docker-compose.yml logs --tail 200
          docker compose -f installer/docker/docker-compose.yml exec -T app sh -c 'tail -n 80 storage/logs/*.log' || true

  ubuntu-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Build the till and back-office assets (as a release does)
        run: |
          (cd pos && npm ci && POS_OUT_DIR=$GITHUB_WORKSPACE/server/public/pos npm run build:server)
          (cd server && npm ci && npm run build)
      - name: Install with the script (over an earlier nginx-based installation, as an update would find it)
        run: |
          sudo apt-get install -y -q nginx
          echo 'server { listen 80; root /var/www/html; }' | sudo tee /etc/nginx/sites-available/seslabs >/dev/null
          sudo rm -f /etc/nginx/sites-enabled/default && sudo ln -sf /etc/nginx/sites-available/seslabs /etc/nginx/sites-enabled/seslabs
          sudo systemctl restart nginx
          sudo bash installer/ubuntu/install.sh --source "$GITHUB_WORKSPACE" --ci
          ! systemctl is-active --quiet nginx   # retired: it served only our site
      - name: The server answers and runs again as an update
        run: |
          # Over https with the server's own certificate (the script made this machine trust it).
          curl -fsS https://localhost/admin/login | grep -q 'Sign in'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://localhost/.env)" = 404
          curl -fsS https://localhost/pos/some/deep/link | grep -q '<div id="root">'
          ! ss -ltnH 'sport = :8080' | grep -v '127.0.0.1:8080' | grep -q .   # live updates listen on this machine only
          systemctl is-active --quiet seslabs-reverb
          sudo bash installer/ubuntu/install.sh --source "$GITHUB_WORKSPACE" --ci
          curl -fsS https://localhost/up
          cd /var/www/seslabs/server && sudo -u www-data php artisan erp:backup && sudo -u www-data php artisan erp:backup --verify

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Build the till and back-office assets
        shell: pwsh
        run: |
          Push-Location pos; npm ci; $env:POS_OUT_DIR = "$env:GITHUB_WORKSPACE\server\public\pos"; npm run build:server; Pop-Location
          Push-Location server; npm ci; npm run build; Remove-Item node_modules -Recurse -Force; Pop-Location
      - name: Install with the script (setup A)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\install.ps1 -Release "$env:GITHUB_WORKSPACE" -Setup A -Ci
      - name: The server answers
        shell: pwsh
        run: |
          # Over https with the server's own certificate (the installer made this PC trust it); no plain-http port is left.
          if (-not ((Invoke-WebRequest https://localhost/admin/login -UseBasicParsing).Content -match 'Sign in')) { throw 'login page missing' }
          if ((Invoke-WebRequest https://localhost/.env -UseBasicParsing -SkipHttpErrorCheck).StatusCode -ne 404) { throw '.env is reachable' }
          if (-not ((Invoke-WebRequest https://localhost/pos/some/deep/link -UseBasicParsing).Content -match '<div id="root">')) { throw 'till app fallback missing' }
          if (Get-NetTCPConnection -LocalPort 8010 -State Listen -ErrorAction SilentlyContinue) { throw 'the old http port 8010 is still open' }
          if (Get-NetTCPConnection -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue | Where-Object LocalAddress -ne '127.0.0.1') { throw 'live updates listen beyond this PC' }
          # Run the installer again, as an update does: it must stop what is running, replace it and come back up.
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\install.ps1 -Release "$env:GITHUB_WORKSPACE" -Setup A -Ci
          if ($LASTEXITCODE -ne 0) { throw 'update run failed' }
          if (-not ((Invoke-WebRequest https://localhost/admin/login -UseBasicParsing).Content -match 'Sign in')) { throw 'login page missing after the update run' }
          Set-Location C:\SESLabs\server; C:\php\php.exe artisan erp:backup; C:\php\php.exe artisan erp:backup --verify
      - name: Build setup.exe
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Compress-Archive -Path server -DestinationPath release.zip -Force
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DReleaseZip=$env:GITHUB_WORKSPACE\release.zip" /DAppVersion=0.29.2 installer\windows\server-setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: seslabs-server-setup
          path: installer/windows/Output/*.exe

  desktop-till:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: pos/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: pos/src-tauri }
      - run: npm ci
      - name: Unit tests (scale readings)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the installer (MSI and setup.exe)
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: seslabs-till-windows
          path: |
            pos/src-tauri/target/release/bundle/msi/*.msi
            pos/src-tauri/target/release/bundle/nsis/*.exe

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%PRODUCT_NAME% Till</title>
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- The till's light/dark choice (theme.ts) before anything is drawn, so a dark till never flashes white. -->
    <script>try { var t = localStorage.getItem('pos-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}</script>
    <style>html { background: #f4f5f7 } html[data-theme='dark'] { background: #0b1120 } @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0b1120 } }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%PRODUCT_NAME% Till</title>
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- The till's light/dark choice (theme.ts) before anything is drawn, so a dark till never flashes white. -->
    <script>try { var t = localStorage.getItem('pos-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}</script>
    <style>html { background: #f4f5f7 } html[data-theme='dark'] { background: #0b1120 } @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0b1120 } }
      .zx-boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; font: 15px system-ui, 'Segoe UI', sans-serif; color: #5b6270 }
      html[data-theme='dark'] .zx-boot { color: #9ca3af; --zx-ink: #e5e7eb; --zx-mist: #1e4e5a } @media (prefers-color-scheme: dark) { html:not([data-theme='light']) .zx-boot { color: #9ca3af; --zx-ink: #e5e7eb; --zx-mist: #1e4e5a } }</style>
  </head>
  <body>
    <!-- Shown while the till's code loads; the app replaces it. The loader comes from branding/product/loader.svg (npm run brand:loader). -->
    <div id="root"><div class="zx-boot" role="status"><!-- zx-loader --><svg xmlns="http://www.w3.org/2000/svg" class="zx-loader" viewBox="0 0 64 64" width="48" height="48" aria-hidden="true" focusable="false"> <style> .zx-loader rect { transform-box: fill-box; transform-origin: center; animation: zx-wave 1.6s cubic-bezier(.45, 0, .55, 1) infinite both; } .zx-loader .n { fill: var(--zx-ink, #031E4C); } .zx-loader .m { fill: var(--zx-mist, #BFEDEA); } .zx-loader .z { fill: var(--zx-teal, #06AAAA); animation-name: zx-wave-z; } .zx-loader .d1 { animation-delay: .13s; } .zx-loader .d2 { animation-delay: .26s; } .zx-loader .d3 { animation-delay: .39s; } .zx-loader .d4 { animation-delay: .52s; } @keyframes zx-wave { 0%, 100% { transform: scale(.55); opacity: .3; } 38%, 58% { transform: scale(1); opacity: 1; } } @keyframes zx-wave-z { 0%, 100% { transform: scale(.82); opacity: .7; } 38%, 58% { transform: scale(1.08); opacity: 1; } } @media (prefers-reduced-motion: reduce) { .zx-loader rect, .zx-loader .z { animation: zx-breathe 2.4s ease-in-out infinite; transform: none; } @keyframes zx-breathe { 50% { opacity: .55; } } } </style> <rect class="n" x="4" y="4" width="16" height="16" rx="4.5"/> <rect class="n d1" x="24" y="4" width="16" height="16" rx="4.5"/> <rect class="z d2" x="44" y="4" width="16" height="16" rx="4.5"/> <rect class="m d1" x="4" y="24" width="16" height="16" rx="4.5"/> <rect class="z d2" x="24" y="24" width="16" height="16" rx="4.5"/> <rect class="m d3" x="44" y="24" width="16" height="16" rx="4.5"/> <rect class="z d2" x="4" y="44" width="16" height="16" rx="4.5"/> <rect class="n d3" x="24" y="44" width="16" height="16" rx="4.5"/> <rect class="n d4" x="44" y="44" width="16" height="16" rx="4.5"/> </svg><!-- /zx-loader --><span>Starting the till…</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
